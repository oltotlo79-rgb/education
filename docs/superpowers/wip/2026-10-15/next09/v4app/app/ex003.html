<!-- bg-blue-500: 背景色を青の500段階目に -->
<!-- text-white  : 文字色を白に -->
<!-- px-4        : padding（内側余白）の横方向を 1rem (16px) -->
<!-- py-2        : padding の縦方向を 0.5rem (8px) -->
<!-- rounded-lg  : 角を「大きめ」に丸める（border-radius: 0.5rem） -->
<button class="bg-blue-500 text-white px-4 py-2 rounded-lg">
  送信
</button>
