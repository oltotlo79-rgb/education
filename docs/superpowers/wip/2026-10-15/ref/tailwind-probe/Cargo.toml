[package]
name = "tailwind-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
topcoat = { version = "=0.10.0", features = ["tailwind"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
topcoat = { version = "=0.10.0", default-features = false, features = ["tailwind"] }
