test = false
doc = false
bench = false

[[bin]]
name = "query_offset"
path = "fuzz_targets/query_offset.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query_new"
path = "fuzz_targets/query_new.rs"
test = false
doc = false
bench = false
