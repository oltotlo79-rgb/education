[package]
name = "auth_lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
argon2 = "=0.6.0"
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = "0.13.0"
libsql = "=0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
topcoat = "=0.10.0"
