{% load static %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>ログイン</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
  </head>
  <body>
    <header class="site-header"><strong>依頼・承認アプリ</strong></header>
    <main>
      <h1>ログイン</h1>
      {% if form.errors %}<p class="errors">社員番号かパスワードが違います</p>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-grid">
          <label for="id_username">社員番号</label>
          <input id="id_username" name="username" autocomplete="username" required>
          <label for="id_password">パスワード</label>
          <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="actions"><button type="submit" class="btn-primary">ログイン</button></div>
      </form>
    </main>
  </body>
</html>
